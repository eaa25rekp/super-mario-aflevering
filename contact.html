<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Marioclub</title>
</head>


<!-- Performance baseline inden forbedringer: 75 -->

<body>
    <header>
        <a href="index.html" class="logo">Marioclub</a>
    </header>

    <section class="banner">
        <img src="img/banner-copy.webp" alt="marioclub welcome banner">
        <div class="welcome">
            <h1>Get in Touch<br><span>with Marioclub</span></h1>
        </div>
    </section>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html">Join the club</a></li>
            <li><a href="news.html">Latest news</a></li>
            <li><a href="games.html">New games</a></li>
            <li><a href="contact.html" class="join" aria-current="page">Contact</a></li>
        </ul>
    </nav>
    <main>
        <article>
            <h2>Get in touch with me, Mario</h2>
            <form>
                <label for="fname">Your first name</label>
                <textarea id="fname" name="fname" placeholder="Type Firstname" autocomplete="given-name"></textarea>


                <label for="lname">Your last name</label>
                <textarea id="lname" name="lname" placeholder="Type Lastname" autocomplete="family-name"></textarea>

                <label for="email">Your email</label>
                <textarea id="email" name="email" placeholder="Type Email" autocomplete="email" required></textarea>

                <label for="country">Country</label>

                <input list="countries" name="country" id="country" required>

                <datalist id="countries">
                    <option value="Albania">
                    <option value="Austria">
                    <option value="Belarus">
                    <option value="Belgium">
                    <option value="Bosnia">
                    <option value="Bulgaria">
                    <option value="Croatia">
                    <option value="Czech Republic">
                    <option value="Denmark">
                    <option value="Finland">
                    <option value="France">
                    <option value="Georgia">
                    <option value="Germany">
                    <option value="Greece">
                    <option value="Hungary">
                    <option value="Ireland">
                    <option value="Italy">
                    <option value="Kazakhstan">
                    <option value="Lithuania">
                    <option value="Netherlands">
                    <option value="Norway">
                    <option value="Poland">
                    <option value="Portugal">
                    <option value="Romania">
                    <option value="Russia">
                    <option value="Serbia">
                    <option value="Slovakia">
                    <option value="Spain">
                    <option value="Turkey">
                    <option value="Sweden">
                    <option value="Switzerland">
                    <option value="Ukraine">
                    <option value="United Kingdom">
                </datalist>
                <br />
                <label for="question">Your question</label>
                <textarea id="question" name="question" placeholder="Ask a question..."></textarea>
                <input type="submit" value="Get in Touch">
            </form>
        </article>
        <ul class="images">
            <li><img src="img/thumb-1.jpg" alt="mario riding on yoshi"></li>
            <li><img src="img/thumb-2.jpg" alt="mario swimming underwater"></li>
        </ul>
    </main>
    <section class="join">
        <h2>Contact Us today!</h2>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Corporis dignissimos minus voluptatem.</p>
        <form>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" required>
        </form>

    </section>
    <footer>
        <p class="copyright">Copyright 2019 Marioclub</p>
    </footer>
</body>

</html>
